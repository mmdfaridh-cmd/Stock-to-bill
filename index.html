<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ShopEase POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--bg2:#fff;--fg:#111;--mt:#666;--ac:#0f766e;--acd:rgba(15,118,110,.08);--dn:#dc2626;--wn:#d97706;--ok:#15803d;--bd:#e2e5ea;--sb:260px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
.fd{font-family:'Space Grotesk',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
.ip{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:.6rem .9rem;color:var(--fg);width:100%;font-size:14px;font-family:inherit;transition:.15s}
.ip:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acd)}
textarea.ip{resize:vertical;min-height:55px}
.bt{padding:.6rem 1.1rem;border-radius:8px;font-weight:600;cursor:pointer;border:none;font-family:'Space Grotesk',sans-serif;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.bt:active{transform:scale(.96)}
.b1{background:var(--ac);color:#fff}.b1:hover{filter:brightness(1.1)}
.b2{background:var(--bg);color:var(--fg);border:1px solid var(--bd)}
.bd{background:rgba(220,38,38,.08);color:var(--dn)}
.bs{background:rgba(21,128,61,.08);color:var(--ok)}
.bw{background:rgba(217,119,6,.08);color:var(--wn)}
.cd{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:1.1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sb{background:var(--bg2);border-right:1px solid var(--bd);width:var(--sb);height:100vh;position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s;display:flex;flex-direction:column}
@media(min-width:768px){.sb{transform:translateX(0)}.mc{margin-left:var(--sb)}.mb{display:none!important}}
.sb.open{transform:translateX(0)}
.ni{display:flex;align-items:center;gap:11px;padding:11px 18px;color:var(--mt);cursor:pointer;transition:.15s;border-left:3px solid transparent;font-size:13px}
.ni:hover{background:var(--acd)}.ni.on{color:var(--ac);background:var(--acd);border-left-color:var(--ac);font-weight:600}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(2px)}
.mo.on{display:flex}
.mw{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:1.4rem;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;animation:su .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.12)}
@keyframes su{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.bg{display:inline-flex;padding:.15rem .5rem;border-radius:99px;font-size:.65rem;font-weight:600}
.gs{background:rgba(21,128,61,.1);color:var(--ok)}.gd{background:rgba(220,38,38,.1);color:var(--dn)}.gw{background:rgba(217,119,6,.1);color:var(--wn)}
.ob{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:35;display:none}.ob.on{display:block}
.sl{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--bd)}
#reader{width:100%;min-height:220px;background:#000;border-radius:10px;overflow:hidden}
.ci{width:50px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:3px 2px;text-align:center;font-size:11px;font-family:inherit}
.ci:focus{outline:none;border-color:var(--ac)}
#PA{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;overflow-y:auto;align-items:center;justify-content:flex-start;flex-direction:column}
#PA.on{display:flex}
.pc{width:100%;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.2);display:flex;flex-direction:column;min-height:100vh}
@media(min-width:600px){#PA{padding:1.5rem}.pc{max-width:380px;min-height:auto;margin:auto;border-radius:10px;max-height:90vh}}
.pct{position:sticky;top:0;background:#fff;padding:10px 14px;border-bottom:1px solid #eee;display:flex;gap:8px;z-index:10}
.pct .bt{flex:1}
#qr{width:90px;height:90px;margin:4px auto;background:#fff;padding:4px;border-radius:6px}
#qr img{margin:auto}
.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(70px);padding:10px 22px;border-radius:9px;font-size:13px;font-weight:600;z-index:200;transition:.25s;opacity:0;pointer-events:none;font-family:'Space Grotesk',sans-serif;white-space:nowrap}
.tt.on{transform:translateX(-50%) translateY(0);opacity:1}
.tt.ts{background:var(--ok);color:#fff}.tt.te{background:var(--dn);color:#fff}
.tr{transition:background .12s}.tr:hover{background:var(--acd)}
.rb{background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border-radius:10px;padding:14px;margin-top:14px;text-align:center}
.rb button{background:#fff;color:#dc2626;border:none;padding:7px 18px;border-radius:7px;font-weight:700;cursor:pointer;font-size:12px;margin-top:6px;font-family:'Space Grotesk',sans-serif}
.cvp{max-height:180px;overflow:auto;font-size:10px;border:1px solid var(--bd);border-radius:6px;margin:6px 0}
.cvp table{width:100%;border-collapse:collapse}.cvp th,.cvp td{padding:2px 5px;border:1px solid var(--bd);text-align:left;white-space:nowrap}.cvp th{background:var(--bg);font-weight:600;position:sticky;top:0}
@media print{body{background:#fff!important;margin:0!important;padding:0!important;-webkit-print-color-adjust:exact!important}#AP,.sb,header,.mo,.ob,.tt{display:none!important}#PA{display:block!important;position:absolute!important;left:0!important;top:0!important;width:100%!important;background:#fff!important;padding:0!important}.pc{box-shadow:none!important;margin:0!important;max-width:100%!important;min-height:auto!important;border-radius:0!important}.pct{display:none!important}}
</style>
</head>
<body>
<div id="TT" class="tt"></div>
<div id="AP">
<div id="LP" class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-xs">
<div class="text-center mb-6"><div class="w-14 h-14 rounded-xl bg-[var(--ac)] flex items-center justify-center fd font-bold text-white text-xl mx-auto mb-2">S</div><h1 class="fd text-3xl font-bold">ShopEase</h1><p class="text-[var(--mt)] text-sm">Point of Sale</p></div>
<div class="cd"><h2 class="fd text-lg font-bold mb-3">Sign In</h2>
<div class="space-y-2">
<div><label class="text-xs text-[var(--mt)]">Username</label><input type="text" id="LU" class="ip" placeholder="Username" autocomplete="off"></div>
<div><label class="text-xs text-[var(--mt)]">Password</label><input type="password" id="LPW" class="ip" placeholder="Password"></div>
<div class="flex items-center gap-2"><input type="checkbox" id="LA" class="w-4 h-4 accent-[var(--ac)]"><label for="LA" class="text-xs text-[var(--mt)] cursor-pointer">Admin login</label></div>
<button id="LB" class="bt b1 w-full" style="padding:.7rem">Sign In</button>
<p id="LE" class="text-[var(--dn)] text-xs text-center hidden"></p>
</div></div>
<p class="text-center text-[var(--mt)] text-xs mt-4"><b>admin</b> / admin123 &nbsp;|&nbsp; <b>user</b> / user123</p>
<div class="rb"><p style="font-size:12px;opacity:.9">Can't login?</p><button id="RST">RESET DATABASE</button></div>
</div></div>

<div id="MA" class="hidden">
<div class="ob" id="OB"></div>
<aside class="sb" id="SB">
<div class="p-3 border-b border-[var(--bd)] flex items-center gap-2"><div id="SLP" class="w-8 h-8 rounded-lg bg-[var(--ac)] flex items-center justify-center fd font-bold text-white text-sm">S</div><h1 class="fd text-base font-bold truncate" id="SN">ShopEase</h1></div>
<nav class="py-1 flex-1 overflow-y-auto" id="NV"></nav>
<div class="p-3 border-t border-[var(--bd)]"><div class="flex justify-between items-center mb-2 px-1"><span id="UD" class="text-xs text-[var(--mt)]"></span><span id="RD" class="bg gs"></span></div><button id="LO" class="bt bd w-full text-xs">Logout</button></div>
</aside>
<main class="mc min-h-screen">
<header class="p-3 border-b border-[var(--bd)] flex items-center bg-[var(--bg2)] sticky top-0 z-30">
<button id="MB" class="p-1.5 -ml-1 hover:bg-[var(--bg)] rounded-lg mb"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
<h2 id="PT" class="fd text-base font-bold flex-1 text-center">Dashboard</h2>
<div class="w-7 h-7 rounded-full bg-[var(--ac)] flex items-center justify-center fd font-bold text-white text-xs"><span id="UI">A</span></div>
</header>
<div id="PC" class="p-4 md:p-5"></div>
</main></div></div>

<div id="PA"></div>

<div id="SM" class="mo"><div class="mw" style="max-width:380px" onclick="event.stopPropagation()">
<div class="flex justify-between items-center mb-3"><h3 class="fd font-bold">Scan Barcode</h3><button id="CSB" class="text-[var(--mt)] text-xl leading-none">&times;</button></div>
<div id="reader"></div>
<input type="file" id="QF" accept="image/*" style="display:none">
<button id="USB" class="bt b2 w-full mt-3">Upload Image</button>
<p class="text-center text-xs text-[var(--mt)] mt-2">Align barcode in frame</p>
</div></div>

<div id="MO" class="mo"><div class="mw" id="MW" onclick="event.stopPropagation()"></div></div>

<script>
var CU='$\u20B9',cart=[],selCust=null,curU=null,scanner=null,curPage='dashboard',posCat='all',ttm=null;

function G(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
function R(k){localStorage.removeItem(k)}
function TT(m,t){t=t||'s';var e=document.getElementById('TT');e.textContent=m;e.className='tt tt-'+(t==='s'?'ts':'te')+' on';if(ttm)clearTimeout(ttm);ttm=setTimeout(function(){e.classList.remove('on')},2200)}
function beep(){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=1200;o.type='square';g.gain.setValueAtTime(.06,c.currentTime);o.start();o.stop(c.currentTime+.07)}catch(e){}}
function F(n){return CU+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function TD(){return new Date().toISOString().split('T')[0]}
function DD(d){if(!d)return'-';return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function TM(d){if(!d)return'';return new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}
function DT(d){return DD(d)+' '+TM(d)}
function NI(a){return a.length?Math.max.apply(null,a.map(function(x){return x.id}))+1:1}
function CN(id){var c=(G('cats')||[]).find(function(x){return x.id===id});return c?c.name:'-'}
function CUN(id){var c=(G('custs')||[]).find(function(x){return x.id===id});return c?c.name:'Walk-in'}
function E(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function initDB(){
var u=G('users');if(!Array.isArray(u))u=[];
var ae=false,ue=false;
for(var i=0;i<u.length;i++){if(u[i].un==='admin'){u[i].pw='admin123';u[i].ro='admin';ae=true}if(u[i].un==='user'){u[i].pw='user123';u[i].ro='user';ue=true}}
if(!ae)u.unshift({id:1,un:'admin',pw:'admin123',ro:'admin'});
if(!ue)u.push({id:2,un:'user',pw:'user123',ro:'user'});
S('users',u);
if(!G('set'))S('set',{sn:'ShopEase',ad:'Main Street',ph:'555-123-4567',upi:'example@upi',nbi:1,cl:false});
else{var s=G('set');if(s.nbi===undefined)s.nbi=1;if(s.cl===undefined)s.cl=false;S('set',s)}
if(!G('cats'))S('cats',[{id:1,nm:'Electronics'},{id:2,nm:'Groceries'}]);
if(!G('items'))S('items',[{id:1,nm:'Wireless Mouse',cd:'WM001',ci:1,br:'Logitech',pr:599,mr:650,co:400,st:50},{id:2,nm:'Rice 5kg',cd:'RIC05',ci:2,br:'India Gate',pr:450,mr:500,co:380,st:100}]);
if(!G('custs'))S('custs',[{id:1,nm:'John Doe',ph:'9876543210',ad:'12 Market Road, Chennai',ob:0,bl:0}]);
['txns','led','purch','exp','trash','reg'].forEach(function(k){if(!G(k))S(k,[])});
R('curU');
}

function resetAll(){for(var i=localStorage.length-1;i>=0;i--)localStorage.removeItem(localStorage.key(i));initDB();curU=null;document.getElementById('MA').classList.add('hidden');document.getElementById('LP').classList.remove('hidden');document.getElementById('LU').value='';document.getElementById('LPW').value='';document.getElementById('LE').classList.add('hidden');TT('Database reset')}

function doLogin(){
var u=document.getElementById('LU').value.trim(),p=document.getElementById('LPW').value,ia=document.getElementById('LA').checked;
if(!u||!p){showErr('Enter username and password');return}
var users=G('users')||[],found=null;
for(var i=0;i<users.length;i++){if(users[i].un===u&&users[i].pw===p){found=users[i];break}}
if(!found){showErr('Invalid credentials');return}
if(ia&&found.ro!=='admin'){showErr('Not an admin account');return}
curU=found;showApp()
}
function showErr(m){var e=document.getElementById('LE');e.textContent=m;e.classList.remove('hidden');setTimeout(function(){e.classList.add('hidden')},3500)}
function doLogout(){R('curU');curU=null;document.getElementById('MA').classList.add('hidden');document.getElementById('LP').classList.remove('hidden');document.getElementById('LU').value='';document.getElementById('LPW').value='';document.getElementById('LA').checked=false;document.getElementById('LE').classList.add('hidden')}

function showApp(){
if(!curU)return;
document.getElementById('LP').classList.add('hidden');document.getElementById('MA').classList.remove('hidden');
var s=G('set');document.getElementById('SN').textContent=s.sn;document.getElementById('UI').textContent=curU.un.charAt(0).toUpperCase();document.getElementById('UD').textContent=curU.un;
var rd=document.getElementById('RD');rd.textContent=curU.ro;rd.className='bg '+(curU.ro==='admin'?'gs':'gw');
buildNav();goPage('dashboard')
}

var NAV=[
{id:'dashboard',lb:'Dashboard',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/></svg>'},
{id:'pos',lb:'New Sale',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 5v13a2 2 0 002 2h10a2 2 0 002-2V5l-3-3zM3 5h12"/></svg>'},
{id:'items',lb:'Products',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>'},
{id:'cats',lb:'Categories',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>'},
{id:'custs',lb:'Customers',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>'},
{id:'txns',lb:'Transactions',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'},
{id:'reg',lb:'Register',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="14" height="12" rx="2"/><path d="M16 9h4l-4 6"/></svg>',ad:1},
{id:'purch',lb:'Purchases',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="16" height="12" rx="2"/><line x1="1" y1="10" x2="17" y2="10"/></svg>',ad:1},
{id:'exp',lb:'Expenses',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="17"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>',ad:1},
{id:'reports',lb:'Reports',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',ad:1},
{id:'settings',lb:'Settings',ic:'<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="9" r="2.5"/><path d="M16.5 11a1.3 1.3 0 00.3 1.4l.05.05a1.5 1.5 0 010 2.1 1.5 1.5 0 01-2.1 0l-.05-.05a1.3 1.3 0 00-1.4-.3 1.3 1.3 0 00-.8 1.2V17a1.5 1.5 0 01-3 0v-.07a1.3 1.3 0 00-.8-1.2 1.3 1.3 0 00-1.4.3l-.05.05a1.5 1.5 0 01-2.1-2.1l.05-.05A1.3 1.3 0 004.2 12a1.3 1.3 0 00-1.2-.8H2.5a1.5 1.5 0 010-3h.07a1.3 1.3 0 001.2-.8 1.3 1.3 0 00-.3-1.4l-.05-.05a1.5 1.5 0 012.1-2.1l.05.05a1.3 1.3 0 001.4.3 1.3 1.3 0 00.8-1.2V2.5a1.5 1.5 0 013 0v.07a1.3 1.3 0 00.8 1.2 1.3 1.3 0 001.4-.3l.05-.05a1.5 1.5 0 012.1 2.1l-.05.05a1.3 1.3 0 00-.3 1.4 1.3 1.3 0 001.2.8H17a1.5 1.5 0 010 3h-.07a1.3 1.3 0 00-1.2.8z"/></svg>',ad:1}
];

function buildNav(){var nv=document.getElementById('NV');nv.innerHTML='';NAV.forEach(function(n){if(n.ad&&curU.ro!=='admin')return;var d=document.createElement('div');d.className='ni';d.setAttribute('data-p',n.id);d.innerHTML=n.ic+'<span>'+n.lb+'</span>';d.onclick=function(){goPage(n.id)};nv.appendChild(d)})}
function togSB(){document.getElementById('SB').classList.toggle('open');document.getElementById('OB').classList.toggle('on')}
var PT={dashboard:'Dashboard',pos:'New Sale',items:'Products',cats:'Categories',custs:'Customers',txns:'Transactions',reg:'Cash Register',purch:'Purchases',exp:'Expenses',reports:'Reports',settings:'Settings'};
function goPage(p){curPage=p;document.querySelectorAll('.ni').forEach(function(n){n.classList.toggle('on',n.getAttribute('data-p')===p)});document.getElementById('PT').textContent=PT[p]||p;if(window.innerWidth<768){document.getElementById('SB').classList.remove('open');document.getElementById('OB').classList.remove('on')}var c=document.getElementById('PC');switch(p){case'dashboard':pDash(c);break;case'pos':pPOS(c);break;case'items':pItems(c);break;case'cats':pCats(c);break;case'custs':pCusts(c);break;case'txns':pTxns(c);break;case'reg':pReg(c);break;case'purch':pPurch(c);break;case'exp':pExp(c);break;case'reports':pReports(c);break;case'settings':pSett(c);break}}
function MO(h){document.getElementById('MW').innerHTML=h;document.getElementById('MO').classList.add('on')}

/* DASHBOARD */

eInt(document.getElementById('PQY').value)||0;var co=parseFloat(document.getElementById('PCO').value)||0;if(qy<=0){TT('Invalid','e');return}var it=G('items')||[];var i=it.find(function(x){return x.id===iid});if(!i)return;i.st+=qy;if(co>0)i.co=co;S('items',it);var p=G('purch')||[];p.push({id:NI(p),sp:document.getElementById('PSU').value.trim(),dt:TD(),items:[{iid:iid,nm:i.nm,qy:qy,co:co}],tl:qy*co,at:new Date().toISOString()});S('purch',p);MC();TT('Saved');pPurch(document.getElementById('PC'))};document.getElementById('CPU').onclick=MC}}

/* EXPENSES */
function pExp(c){if(curU.ro!=='admin'){c.innerHTML='<div class="cd text-center py-10"><p class="text-[var(--dn)] fd font-bold">Admin only</p></div>';return}var ex=G('exp')||[];var tl=ex.reduce(function(s,e){return s+e.am},0);c.innerHTML='<div class="flex justify-between items-center mb-3"><span class="text-sm text-[var(--mt)]">'+ex.length+' &middot; <span class="text-[var(--dn)] font-medium">'+F(tl)+'</span></span><button id="AEA" class="bt b1">+ Add</button></div><div class="cd overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-xs text-[var(--mt)] border-b border-[var(--bd)]"><th class="p-1.5">Date</th><th class="p-1.5">Category</th><th class="p-1.5">Note</th><th class="p-1.5 text-right">Amount</th><th class="p-1.5 text-right">Act</th></tr></thead><tbody id="ETB"></tbody></table></div>';document.getElementById('AEA').onclick=function(){MO('<h3 class="fd font-bold text-lg mb-3">Add Expense</h3><div class="space-y-2"><div class="grid grid-cols-2 gap-2"><div><label class="text-xs text-[var(--mt)]">Amount *</label><input type="number" id="EMA" class="ip" min="0"></div><div><label class="text-xs text-[var(--mt)]">Category</label><input type="text" id="EMC" class="ip" placeholder="Rent"></div></div><div><label class="text-xs text-[var(--mt)]">Note</label><input type="text" id="EMN" class="ip"></div><div class="flex gap-2 pt-1"><button id="SEM" class="bt b1 flex-1">Save</button><button id="CEM" class="bt b2 flex-1">Cancel</button></div></div>');document.getElementById('SEM').onclick=function(){var am=parseFloat(document.getElementById('EMA').value)||0;if(am<=0){TT('Enter amount','e');return}var ex=G('exp')||[];ex.push({id:NI(ex),am:am,ct:document.getElementById('EMC').value.trim(),dt:TD(),nt:document.getElementById('EMN').value.trim(),at:new Date().toISOString()});S('exp',ex);MC();TT('Added');pExp(document.getElementById('PC'))};document.getElementById('CEM').onclick=MC};fEL()}
function fEL(){var ex=(G('exp')||[]).slice().reverse();var tb=document.getElementById('ETB');if(!tb)return;tb.innerHTML=ex.map(function(e){return'<tr class="tr border-b border-[var(--bd)]"><td class="p-1.5">'+DD(e.dt)+'</td><td class="p-1.5">'+E(e.ct||'-')+'</td><td class="p-1.5 text-[var(--mt)]">'+E(e.nt||'-')+'</td><td class="p-1.5 text-right font-medium text-[var(--dn)]">'+F(e.am)+'</td><td class="p-1.5 text-right"><button class="de text-[var(--dn)] text-xs" data-id="'+e.id+'">Del</button></td></tr>'}).join('')||'<tr><td colspan="5" class="p-3 text-center text-xs text-[var(--mt)]">None</td></tr>';tb.querySelectorAll('.de').forEach(function(b){b.onclick=function(){S('exp',(G('exp')||[]).filter(function(e){return e.id!==parseInt(this.getAttribute('data-id'))}.bind(this)));TT('Deleted');fEL()}})}

/* REPORTS */
function pReports(c){if(curU.ro!=='admin'){c.innerHTML='<div class="cd text-center py-10"><p class="text-[var(--dn)] fd font-bold">Admin only</p></div>';return}var tx=G('txns')||[],ex=G('exp')||[],ym=TD().substring(0,7),mt=tx.filter(function(t){return t.dt.startsWith(ym)}),ms=mt.reduce(function(s,t){return s+t.tl},0),mp=mt.reduce(function(s,t){return s+(t.pf||0)},0),me=ex.filter(function(e){return e.dt.startsWith(ym)}).reduce(function(s,e){return s+e.am},0),du=(G('custs')||[]).reduce(function(s,x){return s+(x.bl||0)},0);var ph=['cash','upi','credit'].map(function(m){var f=mt.filter(function(t){return t.pm===m});var t=f.reduce(function(s,x){return s+x.tl},0);var p=ms?Math.round(t/ms*100):0;var cl=m==='cash'?'var(--ok)':m==='upi'?'var(--wn)':'var(--dn)';return'<div class="mb-2"><div class="flex justify-between text-sm mb-0.5"><span class="capitalize">'+m+'</span><span>'+F(t)+' ('+p+'%)</span></div><div class="w-full bg-[var(--bg)] rounded-full h-1.5"><div class="h-1.5 rounded-full" style="width:'+p+'%;background:'+cl+'"></div></div></div>'}).join('');var pm={};mt.forEach(function(t){t.items.forEach(function(i){pm[i.nm]=(pm[i.nm]||0)+i.q})});var top=Object.entries(pm).sort(function(a,b){return b[1]-a[1]}).slice(0,5);var th=top.map(function(e,i){return'<div class="flex justify-between py-1.5 border-b border-[var(--bd)] last:border-0 text-sm"><div class="flex items-center gap-1.5"><span class="w-5 h-5 rounded-full bg-[var(--acd)] text-[var(--ac)] text-xs flex items-center justify-center font-bold">'+(i+1)+'</span>'+E(e[0])+'</div><span class="font-medium">'+e[1]+'</span></div>'}).join('')||'<p class="text-xs text-[var(--mt)]">No data</p>';c.innerHTML='<div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4"><div class="cd"><p class="text-xs text-[var(--mt)]">Month Sales</p><p class="fd text-lg font-bold">'+F(ms)+'</p><p class="text-xs text-[var(--ok)]">Profit: '+F(mp)+'</p></div><div class="cd"><p class="text-xs text-[var(--mt)]">Expenses</p><p class="fd text-lg font-bold text-[var(--dn)]">'+F(me)+'</p><p class="text-xs text-[var(--mt)]">Net: '+F(mp-me)+'</p></div><div class="cd"><p class="text-xs text-[var(--mt)]">Dues</p><p class="fd text-lg font-bold text-[var(--wn)]">'+F(du)+'</p></div></div><div class="grid md:grid-cols-2 gap-3"><div class="cd"><h3 class="fd font-bold text-sm mb-2">Payments</h3>'+ph+'</div><div class="cd"><h3 class="fd font-bold text-sm mb-2">Top Products</h3>'+th+'</div></div>'}

/* SETTINGS */
function pSett(c){if(curU.ro!=='admin'){c.innerHTML='<div class="cd text-center py-10"><p class="text-[var(--dn)] fd font-bold">Admin only</p></div>';return}var s=G('set');c.innerHTML='<div class="max-w-lg space-y-3"><div class="cd space-y-2"><h3 class="fd font-bold text-sm">Shop</h3><div><label class="text-xs text-[var(--mt)]">Name</label><input type="text" id="SSN" class="ip" value="'+E(s.sn||'')+'"></div><div><label class="text-xs text-[var(--mt)]">Address</label><textarea id="SAD" class="ip">'+E(s.ad||'')+'</textarea></div><div><label class="text-xs text-[var(--mt)]">Phone</label><input type="text" id="SPH" class="ip" value="'+E(s.ph||'')+'"></div><div><label class="text-xs text-[var(--mt)]">UPI</label><input type="text" id="SUP" class="ip" value="'+E(s.upi||'')+'"></div><div><label class="text-xs text-[var(--mt)]">Next Bill #</label><div class="ip bg-gray-50 font-medium">'+s.nbi+' (auto)</div></div><button id="SSS" class="bt b1">Save</button></div><div class="cd space-y-2"><h3 class="fd font-bold text-sm">Store</h3><div class="flex items-center justify-between"><span class="text-sm">'+(s.cl?'Closed':'Open')+'</span><button id="STG" class="bt '+(s.cl?'bs':'bd')+' text-xs">'+(s.cl?'Open':'Close')+'</button></div></div><div class="cd space-y-2"><h3 class="fd font-bold text-sm">Data</h3><div class="grid grid-cols-2 gap-2"><button id="EXB" class="bt b2 text-xs">Export</button><button id="IMB" class="bt b2 text-xs">Import</button><input type="file" id="IMF" accept=".json" style="display:none"></div><button id="RAB" class="bt bd w-full text-xs">Reset All</button></div><div class="cd space-y-2"><h3 class="fd font-bold text-sm">Users</h3><div id="UL"></div><button id="AUB" class="bt b2 w-full text-xs">+ Add</button></div></div>';document.getElementById('SSS').onclick=function(){var s=G('set');s.sn=document.getElementById('SSN').value.trim()||'ShopEase';s.ad=document.getElementById('SAD').value.trim();s.ph=document.getElementById('SPH').value.trim();s.upi=document.getElementById('SUP').value.trim();S('set',s);document.getElementById('SN').textContent=s.sn;TT('Saved')};document.getElementById('STG').onclick=function(){var s=G('set');s.cl=!s.cl;S('set',s);TT(s.cl?'Closed':'Opened');pSett(document.getElementById('PC'))};document.getElementById('EXB').onclick=function(){var d={};for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);d[k]=G(k)}var b=new Blob([JSON.stringify({app:'ShopEasePOS',v:'3.0',d:d},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-'+TD()+'.json';a.click();TT('Exported')};document.getElementById('IMB').onclick=function(){document.getElementById('IMF').click()};document.getElementById('IMF').onchange=function(f){if(!f.target.files[0])return;var r=new FileReader();r.onload=function(e){try{var b=JSON.parse(e.target.result);if(!confirm('Replace all?'))return;Object.keys(b.d).forEach(function(k){S(k,b.d[k])});TT('Imported');setTimeout(function(){location.reload()},800)}catch(err){TT('Invalid','e')}};r.readAsText(f.target.files[0]);f.target.value=''};document.getElementById('RAB').onclick=function(){if(confirm('DELETE ALL?')&&confirm('Sure?'))resetAll()};document.getElementById('AUB').onclick=function(){MO('<h3 class="fd font-bold text-lg mb-3">Add User</h3><div class="space-y-2"><div><label class="text-xs text-[var(--mt)]">Username</label><input type="text" id="NUN" class="ip"></div><div><label class="text-xs text-[var(--mt)]">Password</label><input type="text" id="NPW" class="ip"></div><div><label class="text-xs text-[var(--mt)]">Role</label><select id="NRO" class="ip"><option value="user">User</option><option value="admin">Admin</option></select></div><div class="flex gap-2 pt-1"><button id="SNU" class="bt b1 flex-1">Save</button><button id="CNU" class="bt b2 flex-1">Cancel</button></div></div>');document.getElementById('SNU').onclick=function(){var u=document.getElementById('NUN').value.trim();var p=document.getElementById('NPW').value;var r=document.getElementById('NRO').value;if(!u||!p){TT('Fill fields','e');return}var us=G('users')||[];if(us.find(function(x){return x.un===u})){TT('Exists','e');return}us.push({id:NI(us),un:u,pw:p,ro:r});S('users',us);MC();TT('Added');rUL()};document.getElementById('CNU').onclick=MC};rUL()}
function rUL(){var us=G('users')||[];var el=document.getElementById('UL');if(!el)return;el.innerHTML=us.map(function(u){return'<div class="flex justify-between py-1.5 border-b border-[var(--bd)] last:border-0 text-sm"><div><span class="font-medium">'+E(u.un)+'</span> <span class="bg '+(u.ro==='admin'?'gs':'gw')+'">'+u.ro+'</span></div>'+(u.id!==1?'<button class="du text-[var(--dn)] text-xs" data-id="'+u.id+'">Remove</button>':'')+'</div>'}).join('');el.querySelectorAll('.du').forEach(function(b){b.onclick=function(){S('users',(G('users')||[]).filter(function(u){return u.id!==parseInt(this.getAttribute('data-id'))}.bind(this)));TT('Removed');rUL()}})}

/* IMAGE SCAN */
document.getElementById('QF').onchange=function(f){if(!f.target.files[0])return;try{var qr=new Html5Qrcode("reader");qr.scanFile(f.target.files[0],true).then(function(txt){beep();stopScan();var tg=document.getElementById('SM').getAttribute('data-t');if(tg==='pos'){var it=G('items')||[];var i=it.find(function(x){return x.cd===txt});if(i)addC(i.id);else TT('Not found: '+txt,'e')}else{var el=document.getElementById(tg);if(el)el.value=txt}}).catch(function(){TT('No barcode','e')})}catch(e){TT('Error','e')}f.target.value=''};
