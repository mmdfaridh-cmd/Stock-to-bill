        function renderCustomerList() {
            const search = (document.getElementById('custSearch')?.value || '').toLowerCase();
            const cust = (DB.get('customers') || []).filter(c => c.name.toLowerCase().includes(search) || (c.phone && c.phone.includes(search))).sort((a, b) => a.name.localeCompare(b.name));
            return cust.map(c => `
                <div class="card flex justify-between items-center">
                    <div onclick="viewCustomerLedger(${c.id})" class="cursor-pointer flex-1">
                        <p class="font-medium">${c.name} <span class="text-[var(--muted)] text-xs">${c.phone}</span></p>
                        <p class="text-xs text-[var(--muted)]">${c.address || ''}</p>
                        <p class="text-sm mt-1">Bal: <span class="font-bold ${c.balance > 0 ? 'text-[var(--danger)]' : 'text-[var(--success)]'}">${CURRENCY}${(c.balance||0).toFixed(0)}</span></p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openCustomerModal(${c.id})" class="btn btn-secondary text-xs py-1 px-2">Edit</button>
                        <button onclick="deleteCustomer(${c.id})" class="text-[var(--danger)] text-sm">Del</button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-[var(--muted)] py-4">No customers found</p>';
        }
        
        function exportCustomers() {
            const cust = DB.get('customers') || [];
            if(cust.length === 0) return alert("No customers to export");
            let csv = 'ID,Name,Phone,Address,Balance\n';
            cust.forEach(c => { 
                const sanitize = (str) => `"${String(str||'').replace(/"/g, '""')}"`; 
                csv += `${c.id},${sanitize(c.name)},${sanitize(c.phone)},${sanitize(c.address)},${c.balance||0}\n`; 
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); 
            const url = URL.createObjectURL(blob); 
            const link = document.createElement('a'); 
            link.setAttribute('href', url); 
            link.setAttribute('download', `customers_export_${new Date().toISOString().split('T')[0]}.csv`); 
            link.style.visibility = 'hidden'; document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function openCustomerModal(id = null) { 
            const c = id ? (DB.get('customers')||[]).find(x => x.id === id) : null;
            openModal(`
                <h3 class="font-display font-bold mb-4">${c ? 'Edit' : 'Add'} Customer</h3>
                <div class="space-y-3">
                    <input type="hidden" id="editCustId" value="${c ? c.id : ''}">
                    <input type="text" id="cName" class="input-field" placeholder="Name" value="${c ? c.name : ''}">
                    <input type="tel" id="cPhone" class="input-field" placeholder="Phone" value="${c ? c.phone : ''}">
                    <input type="text" id="cAddress" class="input-field" placeholder="Address" value="${c ? c.address : ''}">
                    <input type="number" id="cOpeningBalance" class="input-field" placeholder="Opening Balance / Due" value="${c ? (c.balance || 0) : 0}">
                    <button onclick="saveCustomer()" class="btn btn-primary w-full">Save</button>
                </div>`); 
        }
        
        function saveCustomer() { 
            const editId = document.getElementById('editCustId').value;
            const name = document.getElementById('cName').value.trim(); 
            const phone = document.getElementById('cPhone').value.trim(); 
            const address = document.getElementById('cAddress').value.trim(); 
            const balance = parseFloat(document.getElementById('cOpeningBalance').value) || 0;
            
            if(!name) return; 
            let cust = DB.get('customers') || [];
            if(editId) {
                const idx = cust.findIndex(c => c.id == editId);
                if(idx !== -1) {
                    cust[idx].name = name;
                    cust[idx].phone = phone;
                    cust[idx].address = address;
                    cust[idx].balance = balance;
                }
            } else {
                const newId = Date.now();
                cust.push({id: newId, name, phone, address, balance}); 
                
                const billCustSearch = document.getElementById('billCustSearch');
                if (billCustSearch) {
                    document.getElementById('billCustId').value = newId;
                    billCustSearch.value = name;
                }
            }
            DB.set('customers', cust); 
            closeModal(); 
            
            const billCustSearch = document.getElementById('billCustSearch');
            if (billCustSearch) {
                updateCart();
            } else {
                renderCustomers();
            }
        }
        function deleteCustomer(id) { if(!confirm('Move to trash?')) return; let cust = DB.get('customers') || []; const c = cust.find(x=>x.id===id); if(c){ moveToTrash('customer', c); DB.set('customers', cust.filter(x=>x.id!==id)); renderCustomers(); } }

        // ===== LEDGER =====
        function renderLedger() { 
            const customers = (DB.get('customers') || []).sort((a, b) => a.name.localeCompare(b.name)); 
            const suppliers = (DB.get('suppliers') || []).sort((a, b) => a.name.localeCompare(b.name));
            const totalSupplierDue = suppliers.reduce((a, s) => a + (s.balance || 0), 0);
            
            document.getElementById('pageContent').innerHTML = `
                <div class="grid md:grid-cols-2 gap-4 mb-6">
                    <div class="card"><p class="text-xs text-[var(--muted)]">Total Customer Due</p><p class="font-display text-2xl font-bold text-[var(--danger)]">${CURRENCY}${customers.reduce((a, c) => a + (c.balance || 0), 0).toFixed(0)}</p></div>
                    <div class="card"><p class="text-xs text-[var(--muted)]">Total Supplier Due</p><p class="font-display text-2xl font-bold text-[var(--warning)]">${CURRENCY}${totalSupplierDue.toFixed(0)}</p></div>
                </div>
                
                <div class="card mb-6">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="font-bold">Customer Accounts</h4>
                        <input type="text" id="ledgerSearch" class="input-field w-48" placeholder="Search name..." oninput="filterLedgerCustomers()">
                    </div>
                    <div class="grid gap-3" id="ledgerCustomerList">
                        ${renderLedgerCustomerRows(customers)}
                    </div>
                </div>
                
                <div class="card">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="font-bold text-[var(--warning)]">Supplier Accounts</h4>
                        <button onclick="openSupplierAdvanceModal()" class="btn btn-warning text-xs py-1 px-3">Pay Advance</button>
                    </div>
                    <div class="grid gap-3" id="ledgerSupplierList">
                        ${renderLedgerSupplierRows(suppliers)}
                    </div>
                </div>`;
        }

        function filterLedgerCustomers() {
            const q = (document.getElementById('ledgerSearch').value || '').toLowerCase();
            const customers = (DB.get('customers') || []).filter(c => c.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
            document.getElementById('ledgerCustomerList').innerHTML = renderLedgerCustomerRows(customers);
        }

        function renderLedgerCustomerRows(customers) {
             return customers.map(c => `
                <div class="flex justify-between items-center p-2 bg-[var(--bg)] rounded-lg">
                    <div>
                        <p class="font-medium">${c.name}</p>
                        <p class="${c.balance > 0 ? 'text-[var(--danger)]' : 'text-[var(--success)]'} font-bold text-sm">
                            ${c.balance > 0 ? 'Due: ' + CURRENCY + (c.balance||0).toFixed(0) : 'Settled'}
                        </p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="viewCustomerLedger(${c.id})" class="btn btn-secondary text-xs py-1 px-3">History</button>
                        ${c.balance > 0 ? `<button onclick="openPaymentModal(${c.id}, ${c.balance})" class="btn btn-primary text-xs py-1 px-3">Pay</button>` : ''}
                    </div>
                </div>
            `).join('') || '<p class="text-center text-[var(--muted)] text-sm">No customers found.</p>';
        }

        function renderLedgerSupplierRows(suppliers) {
            return suppliers.map(s => `
                <div class="flex justify-between items-center p-2 bg-[var(--bg)] rounded-lg">
                    <div>
                        <p class="font-medium">${s.name}</p>
                        <p class="${s.balance > 0 ? 'text-[var(--danger)]' : 'text-[var(--success)]'} font-bold text-sm">
                            ${s.balance > 0 ? 'Due: ' + CURRENCY + (s.balance||0).toFixed(0) : (s.balance < 0 ? 'Advance: ' + CURRENCY + Math.abs(s.balance).toFixed(0) : 'Settled')}
                        </p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="viewSupplierLedger(${s.id})" class="btn btn-secondary text-xs py-1 px-3">History</button>

        function openPaymentModal(custId, bal) { openModal(`<h3 class="font-display font-bold mb-4">Record Payment</h3><input type="number" id="paymentAmount" class="input-field mb-3" value="${bal}"><button onclick="savePayment(${custId})" class="btn btn-primary w-full">Save</button>`); }
        function savePayment(custId) { const amount = parseFloat(document.getElementById('paymentAmount').value); if(!amount || amount <= 0) return alert("Invalid"); let customers = DB.get('customers'); const idx = customers.findIndex(c => c.id === custId); if(idx !== -1) { customers[idx].balance -= amount; if(customers[idx].balance < 0) customers[idx].balance = 0; DB.set('customers', customers); } let ledger = DB.get('ledger') || []; ledger.push({id: Date.now(), customerId: custId, type: 'payment', amount, date: new Date().toISOString()}); DB.set('ledger', ledger); closeModal(); renderLedger(); }
        
        function openSupplierPaymentModal(purchaseId = null, supId = null) {
            let p = null;
            let supplierId = supId;
            let amount = 0;
            
            if (purchaseId) {
                p = (DB.get('purchases')||[]).find(x=>x.id===purchaseId);
                if(!p) return;
                supplierId = p.supplierId;
                amount = p.totalCost;
            }
            
            if (!supplierId) return alert("Supplier not found");

            openModal(`<h3 class="font-display font-bold mb-4">Pay Supplier</h3>
            ${p ? `<p class="text-sm mb-2">Paying for: <strong>Invoice ${p.invNo}</strong></p>` : ''}
            <input type="hidden" id="supPayId" value="${supplierId}">
            <input type="hidden" id="supPayPurchaseId" value="${purchaseId || ''}">
            <input type="number" id="supplierPayAmount" class="input-field mb-3" value="${amount}" placeholder="Amount">
            <button onclick="saveSupplierPayment()" class="btn btn-primary w-full">Pay</button>`);
        }

        function saveSupplierPayment() {
            const amount = parseFloat(document.getElementById('supplierPayAmount').value);
            const supId = parseFloat(document.getElementById('supPayId').value);
            const purchaseId = document.getElementById('supPayPurchaseId').value;
            
            if(!amount || amount <= 0) return alert("Invalid amount");
            
            let suppliers = DB.get('suppliers') || [];
            const idx = suppliers.findIndex(s => s.id === supId);
            if(idx !== -1) {
                suppliers[idx].balance -= amount;
                DB.set('suppliers', suppliers);
            }
            
            let ledger = DB.get('ledger') || [];
            ledger.push({id: Date.now(), type: 'supplier_payment', amount, date: new Date().toISOString(), purchaseId: purchaseId || null, supplierId: supId});
            DB.set('ledger', ledger);
            
            if (purchaseId) {
                let purchases = DB.get('purchases') || [];
                const pIdx = purchases.findIndex(p => p.id === purchaseId);
                if(pIdx !== -1) { 
                    if(amount >= purchases[pIdx].totalCost) purchases[pIdx].payType = 'cash'; 
                    DB.set('purchases', purchases); 
                }
            }
            closeModal(); renderLedger();
        }

        function openSupplierAdvanceModal() {
            const suppliers = DB.get('suppliers') || [];
            openModal(`
                <h3 class="font-display font-bold mb-4">Supplier Advance Payment</h3>
                <div class="space-y-3">
                    <select id="advSupId" class="input-field">
                        <option value="">Select Supplier</option>
                        ${suppliers.map(s => `<option value="${s.id}">${s.name} (Bal: ${CURRENCY}${s.balance.toFixed(0)})</option>`).join('')}
                    </select>
                    <input type="number" id="advAmount" class="input-field" placeholder="Advance Amount">
                    <button onclick="saveSupplierAdvance()" class="btn btn-primary w-full">Save</button>
                </div>
            `);
        }

        function saveSupplierAdvance() {
            const supId = parseFloat(document.getElementById('advSupId').value);
            const amount = parseFloat(document.getElementById('advAmount').value);
            if(!supId || !amount || amount <= 0) return alert("Invalid input");
            let suppliers = DB.get('suppliers');
            const idx = suppliers.findIndex(s => s.id === supId);
            if(idx !== -1) {
                suppliers[idx].balance -= amount;
                DB.set('suppliers', suppliers);
            }
            let ledger = DB.get('ledger') || [];
            ledger.push({id: Date.now(), type: 'supplier_advance', amount, date: new Date().toISOString(), supplierId: supId});
            DB.set('ledger', ledger);
            closeModal(); renderLedger();
        }

        function viewCustomerLedger(custId) { 
            const customer = (DB.get('customers')||[]).find(c => c.id === custId); 
            const transactions = (DB.get('transactions')||[]).filter(t => t.customerId === custId); 
            const payments = (DB.get('ledger')||[]).filter(l => l.customerId === custId); 
            
            const history = [
                ...transactions.map(t => ({ date: t.date, desc: `${t.type === 'credit' ? 'Credit Sale' : (t.type === 'upi' ? 'UPI Sale' : 'Cash Sale')} #${t.id}`, amount: t.total, type: 'debit' })), 
                ...payments.map(p => ({ date: p.date, desc: 'Payment Received', amount: p.amount, type: 'credit' }))
            ].sort((a,b) => new Date(b.date) - new Date(a.date)); 
            
            const settings = DB.get('settings');
            let stmtText = `*${settings.shopName}*\nLedger Statement\nCustomer: ${customer.name}\nBalance: ${CURRENCY}${(customer.balance||0).toFixed(0)}\n-------------------\n`;
            history.forEach(h => { stmtText += `${new Date(h.date).toLocaleDateString()}: ${h.desc} (${h.type === 'credit' ? '-' : '+'} ${CURRENCY}${h.amount.toFixed(0)})\n`; });

            openModal(`
                <h3 class="font-display font-bold mb-2">${customer.name}</h3>
                <p class="text-xs text-[var(--muted)] mb-4">Current Balance: ${CURRENCY}${(customer.balance||0).toFixed(0)}</p>
                <div class="space-y-2 max-h-60 overflow-y-auto">
                    ${history.map(h => `
                        <div class="flex justify-between items-center p-2 bg-[var(--bg)] rounded text-sm">
                            <div>
                                <p>${h.desc}</p>
                                <p class="text-[var(--muted)] text-xs">${new Date(h.date).toLocaleString()}</p>
                            </div>
                            <p class="font-bold ${h.type === 'credit' ? 'text-[var(--accent)]' : 'text-[var(--danger)]'}">
                                ${h.type === 'credit' ? '+' : '-'} ${CURRENCY}${h.amount.toFixed(0)}
                            </p>
                        </div>
                    `).join('')}
                </div>
                <div class="flex gap-2 mt-4">
                    <a href="https://wa.me/${customer.phone ? customer.phone.replace(/[^0-9]/g, '') : ''}?text=${encodeURIComponent(stmtText)}" target="_blank" class="btn btn-success flex-1">WhatsApp</a>
                    <button onclick="printCustomerLedger(${custId})" class="btn btn-primary flex-1">Print</button>
                </div>
            `); 
        }

        function viewSupplierLedger(supId) { 
            const supplier = (DB.get('suppliers')||[]).find(s => s.id === supId); 
            const purchases = (DB.get('purchases')||[]).filter(p => p.supplierId === supId);
            const payments = (DB.get('ledger')||[]).filter(l => l.supplierId === supId && (l.type === 'supplier_payment' || l.type === 'supplier_advance'));
            
            const history = [
                ...purchases.map(p => ({ date: p.date, desc: `Purchase Inv: ${p.invNo}`, amount: p.totalCost, type: 'debit', refId: p.id, refType: 'purchase' })), 
                ...payments.map(p => ({ date: p.date, desc: `Payment Made`, amount: p.amount, type: 'credit', refId: p.id, refType: 'payment' }))
            ].sort((a,b) => new Date(b.date) - new Date(a.date)); 
            
            openModal(`
                <h3 class="font-display font-bold mb-2">${supplier.name}</h3>
                <p class="text-xs text-[var(--muted)] mb-4">Current Balance: ${CURRENCY}${(supplier.balance||0).toFixed(0)}</p>
                <div class="space-y-2 max-h-60 overflow-y-auto">
                    ${history.map(h => `
                        <div class="flex justify-between items-center p-2 bg-[var(--bg)] rounded text-sm">
                            <div>
                                <p>${h.desc}</p>
                                <p class="text-[var(--muted)] text-xs">${new Date(h.date).toLocaleString()}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <p class="font-bold ${h.type === 'credit' ? 'text-[var(--accent)]' : 'text-[var(--danger)]'}">
                                    ${h.type === 'credit' ? '-' : '+'} ${CURRENCY}${h.amount.toFixed(0)}
                                </p>
                                ${h.refType === 'purchase' ? `<button onclick="closeModal(); renderPurchaseEditor(${h.refId})" class="btn btn-secondary text-xs py-1 px-2">Edit</button>` : ''}
                            </div>
                        </div>
                    `).join('') || '<p class="text-center text-[var(--muted)] py-4">No history found.</p>'}
                </div>
                <button onclick="closeModal()" class="btn btn-secondary w-full mt-4">Close</button>
            `); 
        }

        function printCustomerLedger(custId) {
            const customer = (DB.get('customers')||[]).find(c => c.id === custId); 
            const transactions = (DB.get('transactions')||[]).filter(t => t.customerId === custId); 
            const payments = (DB.get('ledger')||[]).filter(l => l.customerId === custId); 
            const history = [
                ...transactions.map(t => ({ date: t.date, desc: `${t.type === 'credit' ? 'Credit Sale' : (t.type === 'upi' ? 'UPI Sale' : 'Cash Sale')} #${t.id}`, amount: t.total, type: 'debit' })), 
                ...payments.map(p => ({ date: p.date, desc: 'Payment Received', amount: p.amount, type: 'credit' }))
            ].sort((a,b) => new Date(b.date) - new Date(a.date));
            const settings = DB.get('settings');

            const html = `
                <div style="font-family: 'Courier New', monospace; padding: 20px;">
                    <h1 style="text-align:center;">${settings.shopName}</h1>
                    <p style="text-align:center; font-size:12px;">Ledger Statement</p>
                    <hr style="border:dashed 1px #000; margin: 10px 0;">
                    <p><strong>Customer:</strong> ${customer.name}</p>
                    <p><strong>Phone:</strong> ${customer.phone || 'N/A'}</p>
                    <p><strong>Balance Due:</strong> ${CURRENCY}${(customer.balance||0).toFixed(0)}</p>
                    <hr style="border:dashed 1px #000; margin: 10px 0;">
                    <table style="width:100%; font-size:12px;">
                        <thead><tr><th align="left">Date</th><th align="left">Description</th><th align="right">Amount</th></tr></thead>
                        <tbody>
                            ${history.map(h => `<tr>
                                <td>${new Date(h.date).toLocaleDateString()}</td>
                                <td>${h.desc}</td>
                                <td align="right">${h.type === 'credit' ? '+' : '-'} ${CURRENCY}${h.amount.toFixed(0)}</td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            const printWindow = window.open('', '', 'height=600,width=400');
            printWindow.document.write('<html><head><title>Ledger</title></head><body>');
            printWindow.document.write(html);
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.print();
        }

        // ===== SETTINGS (With Data Management) =====
        function renderSettings() { 
            const settings = DB.get('settings'); 
            const users = DB.get('users') || []; 
            const trash = DB.get('trash') || [];
            
            document.getElementById('pageContent').innerHTML = `
                <div class="grid md:grid-cols-2 gap-4">
                    <div class="card">
                        <h3 class="font-display font-bold mb-4">Shop Details</h3>
                        <div class="space-y-3">
                            <div class="flex items-center gap-3 cursor-pointer" onclick="document.getElementById('shopImgInput').click()">
                                <div class="w-16 h-16 rounded-lg bg-[var(--bg)] border flex items-center justify-center overflow-hidden" id="shopImgPreview">
                                    ${settings.shopImage ? `<img src="${settings.shopImage}" class="w-full h-full object-cover">` : '<span class="text-xs text-center">Logo</span>'}
                                </div>
                                <input type="file" id="shopImgInput" class="hidden" accept="image/*" onchange="previewShopImg(this)">
                                <span class="text-xs text-[var(--muted)]">Change Logo</span>
                            </div>
                            <input type="text" id="settingName" class="input-field" value="${settings.shopName}">
                            <input type="text" id="settingAddress" class="input-field" value="${settings.address}">
                            <input type="text" id="settingPhone" class="input-field" value="${settings.phone}">
                            <input type="text" id="settingUpi" class="input-field" value="${settings.upiId}" placeholder="UPI ID">
                            <div class="flex gap-2 items-center">
                                <input type="number" id="settingOpeningCash" class="input-field" placeholder="Opening Cash Balance" value="${settings.openingCash || 0}">
                                <span class="text-xs text-[var(--muted)]">Opening cash</span>
                            </div>
                            <input type="text" id="settingDefaultQuote" class="input-field" value="${settings.defaultQuote || ''}" placeholder="Default Wishes/Quote for Bills">
                            <button onclick="saveSettings()" class="btn btn-primary w-full">Save</button>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div class="card">
                            <h3 class="font-display font-bold mb-4">Data Management</h3>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center p-2 bg-[var(--bg)] rounded-lg">
                                    <div>
                                        <p class="text-sm font-medium">Data Backup</p>
                                        <p class="text-xs text-[var(--muted)]">Click to download backup file</p>
                                    </div>
                                    <button onclick="manualBackup()" class="btn btn-warning text-xs py-1 px-3">Backup Now</button>
                                </div>
                                <div class="border-t pt-3">
                                    <label class="btn btn-secondary w-full cursor-pointer text-center">
                                        <input type="file" class="hidden" accept=".json" onchange="restoreData(event)">
                                        Restore Backup
                                    </label>
                                    <p class="text-xs text-[var(--muted)] text-center mt-1">Upload .json backup file</p>
                                </div>
                                <button onclick="clearAllData()" class="btn btn-danger w-full">Clear All Data</button>
                            </div>
                        </div>
                        <div class="card">
                            <h3 class="font-display font-bold mb-2">Users</h3>
                            <div class="space-y-2">
                                ${users.map(u => `
                                    <div class="flex justify-between items-center p-2 bg-[var(--bg)] rounded-lg">
                                        <div>
                                            <p class="text-sm">${u.username} <span class="badge ${u.role === 'admin' ? 'badge-success' : ''}">${u.role}</span></p>
                                        </div>
                                        <button onclick="openUserModal(${u.id})" class="btn btn-secondary text-xs py-1 px-2">Edit</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="card">
                            <h3 class="font-display font-bold mb-2">Recycle Bin</h3>
                            <div class="space-y-2 max-h-40 overflow-y-auto">
                                ${trash.map((t, i) => `
                                    <div class="flex justify-between items-center p-2 bg-[var(--bg)] rounded text-xs">
                                        <div>
                                            <span class="font-medium">${t.type}</span>: ${t.data.name || '#' + t.data.id}<br>
                                            <span class="text-[var(--muted)]">${Math.floor((new Date() - new Date(t.deletedAt))/(1000*60*60*24))}d ago</span>
                                        </div>
                                        <button onclick="restoreFromTrash(${i})" class="btn btn-success text-xs py-1 px-2">Restore</button>
                                    </div>
                                `).join('') || '<p class="text-xs text-[var(--muted)]">Empty</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `; 
        }

        function openUserModal(userId) {
            const users = DB.get('users') || [];
            const user = users.find(u => u.id === userId);
            if(!user) return;

            openModal(`
                <h3 class="font-display font-bold mb-4">Edit User</h3>
                <div class="space-y-3">
                    <input type="hidden" id="editUserId" value="${userId}">
                    <input type="text" id="editUsername" class="input-field" placeholder="Username" value="${user.username}">
                    <input type="password" id="editPassword" class="input-field" placeholder="New Password (leave blank to keep current)">
                    <p class="text-xs text-[var(--muted)] -mt-2">Enter a new password only if you want to change it.</p>
                    <div class="flex gap-3 pt-2">
                        <button onclick="saveUser()" class="btn btn-primary flex-1">Save</button>
                        <button onclick="resetUserPassword()" class="btn btn-warning flex-1">Reset Password</button>
                        <button onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                    </div>
                </div>
            `);
        }

        function saveUser() {
            const userId = parseInt(document.getElementById('editUserId').value);
            const newUsername = document.getElementById('editUsername').value.trim();
            const newPassword = document.getElementById('editPassword').value;
            
            if(!newUsername) return alert("Username cannot be empty.");

            let users = DB.get('users') || [];
            const idx = users.findIndex(u => u.id === userId);
            
            if(idx !== -1) {
                users[idx].username = newUsername;
                if(newPassword) {
                    users[idx].password = newPassword;
                }
                DB.set('users', users);

                if(currentUser && currentUser.id === userId) {
                    currentUser.username = newUsername;
                    DB.set('currentUser', currentUser);
                    document.getElementById('currentUserDisplay').textContent = newUsername;
                    document.getElementById('userInitial').textContent = newUsername.charAt(0).toUpperCase();
                }
                
                closeModal();
                renderSettings();
            } else {
                alert("User not found.");
            }
        }

        function resetUserPassword() {
            const userId = parseInt(document.getElementById('editUserId').value);
            if(!confirm('Reset password to "password123"?')) return;
            let users = DB.get('users') || [];
            const idx = users.findIndex(u => u.id === userId);
            if(idx !== -1) {
                users[idx].password = 'password123';
                DB.set('users', users);
                alert('Password has been reset to "password123".');
                closeModal();
            }
        }

        function previewShopImg(input) { 
            if(input.files[0]) { 
                processImage(input.files[0], (dataUrl) => {
                    window.tmpShopImg = dataUrl; 
                    document.getElementById('shopImgPreview').innerHTML = `<img src="${dataUrl}" class="w-full h-full object-cover">`; 
                });
            } 
        }
        function saveSettings() { 
            const settings = { 
                shopName: document.getElementById('settingName').value.trim(), 
                address: document.getElementById('settingAddress').value.trim(), 
                phone: document.getElementById('settingPhone').value.trim(), 
                upiId: document.getElementById('settingUpi').value.trim(), 
                shopImage: window.tmpShopImg || DB.get('settings').shopImage, 
                openingCash: parseFloat(document.getElementById('settingOpeningCash').value) || 0, 
                nextBillId: DB.get('settings').nextBillId, 
                isStoreClosed: DB.get('settings').isStoreClosed,
                defaultQuote: document.getElementById('settingDefaultQuote').value.trim(),
                nextPurchaseInvId: DB.get('settings').nextPurchaseInvId
            }; 
            DB.set('settings', settings); 
            document.getElementById('shopNameSidebar').textContent = settings.shopName; 
            if(settings.shopImage) { document.getElementById('sidebarLogo').src = settings.shopImage; document.getElementById('sidebarLogo').classList.remove('hidden'); document.getElementById('sidebarLogoPlaceholder').classList.add('hidden'); } 
            alert('Saved'); 
        }

        currentUser = DB.get('currentUser');
        if(currentUser) showApp();
    </script>
</body>
</html>
